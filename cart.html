<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopLite — Shopping Cart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <header class="sticky-top bg-white shadow-sm">
      <nav class="navbar navbar-expand-lg navbar-light container">
        <div class="container-fluid px-0">
          <a class="navbar-brand fw-bold text-primary fs-3" href="index.html">
            <i class="bi bi-lightning-fill"></i>ShopLite
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-medium">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="register.html">Register/Contact</a>
              </li>
            </ul>
            <div class="d-flex align-items-center">
              <a
                href="cart.html"
                class="btn btn-outline-dark position-relative rounded-pill px-3"
              >
                <i class="bi bi-cart3 me-1"></i> Shopping Cart
                <span
                  id="cart-badge"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"
                >
                  0
                </span>
              </a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-5 flex-grow-1">
      <h1 class="h2 fw-bold text-dark mb-4">
        <i class="bi bi-cart3 me-2"></i>My Cart
      </h1>

      <div id="empty-cart-state" class="text-center py-5 d-none">
        <div class="mb-4">
          <i class="bi bi-cart-x text-muted" style="font-size: 5rem"></i>
        </div>
        <h3 class="h4 text-secondary">Your shopping cart is empty!</h3>
        <p class="text-muted mb-4">
          Return to homepage and choose your favorite items.
        </p>
        <a
          href="index.html"
          class="btn btn-primary px-4 py-2 rounded-pill fw-medium shadow-sm"
        >
          <i class="bi bi-arrow-left me-2"></i>Continue buying
        </a>
      </div>

      <div id="cart-content" class="row g-4">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm rounded-3">
            <div id="cart-items" class="card-body p-0 divide-y"></div>
          </div>

          <div class="text-end mt-3">
            <button
              id="clear-cart-btn"
              class="btn btn-outline-danger btn-sm rounded-pill"
            >
              <i class="bi bi-trash3 me-1"></i>Clear Shopping Cart
            </button>
          </div>
        </div>

        <div class="col-lg-4">
          <div
            class="card border-0 shadow-sm rounded-3 position-sticky"
            style="top: 90px"
          >
            <div class="card-body p-4">
              <h3 class="h5 fw-bold text-dark mb-4">Order Summary</h3>

              <div class="d-flex justify-content-between mb-3 text-muted">
                <span>Total Items:</span>
                <span id="total-quantity" class="fw-medium text-dark">0</span>
              </div>

              <div class="d-flex justify-content-between mb-3 text-muted">
                <span>Shipment fee:</span>
                <span class="text-success fw-medium">Free</span>
              </div>

              <hr class="my-3" />

              <div
                class="d-flex justify-content-between align-items-center mb-4"
              >
                <span class="fw-bold text-dark fs-5">Total:</span>
                <span id="cart-total" class="fw-bold text-danger fs-4"
                  >$0.00</span
                >
              </div>

              <button
                id="checkout-btn"
                class="btn btn-primary w-100 btn-lg fw-medium rounded-3 shadow-sm"
              >
                <i class="bi bi-credit-card-2-front-fill me-2"></i>Checkout
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-light py-4">
      <div class="container text-center">
        <p class="mb-0 fw-bold">&copy; 2026 ShopLite Mini E-Commerce.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
